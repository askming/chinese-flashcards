<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="汉字卡">
  <title>汉字 Flashcards</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/hanzi-writer.min.js" defer></script>
  <script src="sync.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <nav class="topnav">
    <button type="button" data-nav="home">Home</button>
    <button type="button" data-nav="levels">Practice</button>
    <button type="button" data-nav="stats">Progress</button>
    <button type="button" id="profile-chip" class="profile-chip" data-nav="profiles" aria-label="Switch profile"></button>
  </nav>

  <main>
    <!-- Who's practicing? -->
    <section id="profiles" class="screen">
      <h2>Who's practicing? 谁来练习？</h2>
      <p id="profiles-sub" class="sub"></p>
      <div id="profile-grid" class="profile-grid"></div>
      <form id="profile-form" class="profile-form" hidden>
        <h3 id="pf-title"></h3>
        <input id="pf-name" class="pf-input" maxlength="20" placeholder="Name 名字" autocomplete="off">
        <div id="pf-avatars" class="avatar-pick"></div>
        <div class="form-row">
          <button type="submit" class="btn btn-blue">Save</button>
          <button type="button" id="pf-cancel" class="btn btn-secondary">Cancel</button>
        </div>
        <button type="button" id="pf-delete" class="link-btn danger" hidden>Delete this profile</button>
      </form>
      <div id="sync-card" class="sync-card"></div>
    </section>

    <!-- Home: greeting, practice calendar, stats -->
    <section id="home" class="screen">
      <h1 class="hello">Welcome! It's time to boost your Chinese!</h1>
      <p class="hello-date" id="home-date"></p>
      <div class="cal-card">
        <div class="cal-head">
          <button id="cal-prev-y" class="cal-nav" type="button" aria-label="Previous year">«</button>
          <button id="cal-prev" class="cal-nav" type="button" aria-label="Previous month">‹</button>
          <button id="cal-title" class="cal-title" type="button" title="Back to today"></button>
          <button id="cal-next" class="cal-nav" type="button" aria-label="Next month">›</button>
          <button id="cal-next-y" class="cal-nav" type="button" aria-label="Next year">»</button>
        </div>
        <div id="calendar" class="calendar"></div>
      </div>
      <div id="home-stats" class="stats-block"></div>
      <div id="day-panel" class="day-panel"></div>
      <p id="load-error" class="error" hidden></p>
    </section>

    <!-- Levels list -->
    <section id="levels" class="screen">
      <h2>What do you want to practice?</h2>
      <div id="level-list" class="level-list"></div>
    </section>

    <!-- One level: all its characters -->
    <section id="detail" class="screen">
      <h2 id="detail-title"></h2>
      <p id="detail-sub" class="sub"></p>
      <div id="detail-grid"></div>
      <div class="legend"><span class="dot mastered"></span>认识 <span class="dot missed"></span>不认识 <span class="dot"></span>还没练</div>
      <button id="btn-start" class="btn btn-blue sticky-bottom" type="button">开始练习</button>
    </section>

    <!-- Flashcard -->
    <section id="study" class="screen">
      <header class="study-header">
        <h2 id="study-title"></h2>
        <span id="progress-text" class="progress-text"></span>
      </header>
      <div class="progress"><div id="progress-bar"></div></div>

      <div class="card-wrap">
        <div id="card" class="card">
          <div class="face front">
            <p class="prompt">Do you recall this character?</p>
            <div id="front-char" class="big-char"></div>
            <div class="answer-btns">
              <button id="btn-known" class="btn btn-green" type="button">认识</button>
              <button id="btn-unknown" class="btn btn-red" type="button">不认识</button>
            </div>
          </div>

          <div class="face back">
            <div class="back-scroll">
              <div class="pinyin-row">
                <span id="back-pinyin" class="pinyin"></span>
                <button class="speak-btn" type="button" data-speak-char aria-label="Play pronunciation">🔊</button>
              </div>
              <div class="writer-row">
                <div id="writer" class="writer-grid"></div>
                <div class="writer-btns">
                  <button id="btn-animate" class="chip" type="button">▶ 笔顺</button>
                  <button id="btn-quiz" class="chip" type="button">✍ 练写</button>
                </div>
              </div>
              <div id="writer-msg" class="writer-msg"></div>

              <div id="words-block">
                <h3>组词</h3>
                <ul id="back-words" class="words"></ul>
              </div>
              <div id="sentence-block">
                <h3>造句</h3>
                <div id="back-sentence" class="sentence"></div>
              </div>
            </div>
            <div class="back-footer">
              <span id="result-tag" class="result-tag"></span>
              <button id="btn-prev" class="btn btn-secondary btn-prev" type="button" hidden>‹ 上一个</button>
              <button id="btn-next" class="btn btn-yellow" type="button">下一个</button>
            </div>
          </div>
        </div>
      </div>
      <button id="btn-viewall" class="btn btn-blue btn-small" type="button">看全部</button>
    </section>

    <!-- End of a practice session -->
    <section id="done" class="screen">
      <h2 class="center">Session complete 🎉</h2>
      <div class="score">
        <div><strong id="sum-known">0</strong><span>认识</span></div>
        <div><strong id="sum-unknown">0</strong><span>不认识</span></div>
      </div>
      <div id="sum-missed" class="missed-chars"></div>
      <button id="btn-review-missed" class="btn btn-red" type="button">再练不认识的</button>
      <button id="btn-again" class="btn btn-secondary" type="button">再练一遍</button>
      <button id="btn-to-levels" class="btn btn-secondary" type="button">选别的等级</button>
    </section>

    <!-- Summary: mastery per level -->
    <section id="stats" class="screen">
      <h2>Progress</h2>
      <p id="stats-total" class="sub"></p>
      <div id="stats-list" class="stats-list"></div>
      <p class="sub hint">Tap a bar to practice the characters you haven't mastered yet.</p>

      <h2 class="settings-head">Voice 声音</h2>
      <ul id="voice-list" class="voice-list"></ul>
      <button id="reset-progress" class="link-btn" type="button">Reset progress</button>
    </section>
  </main>
</body>
</html>
